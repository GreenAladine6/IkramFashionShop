
  services:
    db:
      image: postgres:16-alpine
      container_name: ikramfashionshop-db
      restart: unless-stopped

      environment:
        POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
        POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
        

      ports:
        - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

      volumes:
        - ikramfashionshop_pgdata:/var/lib/postgresql/data

      healthcheck:
        test:
          - CMD-SHELL
          - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
        interval: 5s
        timeout: 5s
        retries: 10

  volumes:
    ikramfashionshop_pgdata:
